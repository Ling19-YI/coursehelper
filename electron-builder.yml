appId: com.coursehelper.desktop
productName: 刷课助手 CourseHelper
directories:
  output: release
# 必须用精确白名单：早前用 app/dist/**/* 会把本地探针产物
# （probe-*.mjs、真实作业截图、内含真实密钥与本机绝对路径）打进安装包
files:
  - app/dist/main/**
  - app/dist/preload/**
  - app/dist/spike.js
  - app/dist/package.json
  - app/dist/browsers.json
  - app/renderer/**
  - package.json
  # electron-updater 的运行时依赖树必须随包分发，否则在线更新会失败
  - node_modules/electron-updater/**
  - node_modules/electron-builder-runtime/**
  - node_modules/@electron/**/*
  - node_modules/@electron-toolkit/**/*
  - node_modules/@vscode/**/*
  - node_modules/builder-util-runtime/**
  - node_modules/chalk/**
  - node_modules/detect-libc/**
  - node_modules/js-yaml/**
  - node_modules/lru-cache/**
  - node_modules/semver/**
  - node_modules/tilde/**
  - node_modules/temp/**
  - node_modules/typescript/lib/*.js
asar: true
# 上面这些是 electron-updater 需要的运行时文件，必须解包到磁盘
asarUnpack:
  - "**/node_modules/builder-util-runtime/**"
  - "**/node_modules/electron-updater/**"
  - "**/node_modules/@electron/**/*"
win:
  target:
    - target: nsis
      arch:
        - x64
  icon: build/icon.png
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: 刷课助手
  artifactName: CourseHelper-Setup-${version}.exe
  uninstallDisplayName: 刷课助手 CourseHelper
# 发布源：electron-updater 依赖它来发现新版本并下载
publish:
  - provider: github
    owner: Ling19-YI
    repo: coursehelper
    releaseType: release
    private: false
